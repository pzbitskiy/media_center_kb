// shairport-sync config for media-kb, install as /etc/shairport-sync.conf
// Only the settings that differ from the defaults are listed.
// See shairport-sync.conf.sample shipped with shairport-sync for the rest.

general =
{
	name = "Soundbar";
	output_backend = "alsa";
	// Send full-scale audio, the YSP volume is set from the volume hook below
	ignore_volume_control = "yes";
	// Runs even with ignore_volume_control = "yes".
	// AirPlay volume (-30.0..0.0, -144.0 is mute) is appended after the trailing space
	run_this_when_volume_is_set = "/usr/local/bin/mediackb-airplay volume ";
};

alsa =
{
	// Pi HDMI output, check with `aplay -l` / `aplay -L`:
	//   legacy firmware driver:     "hw:CARD=b1,DEV=0" (bcm2835 HDMI 1)
	//   KMS driver (vc4-kms-v3d):   "hdmi:CARD=vc4hdmi,DEV=0"
	output_device = "hw:CARD=b1,DEV=0";
};

metadata =
{
	// The client model (AppleTV..., iPhone...) selects the soundbar profile,
	// read by mediackb --airplay-metadata. Needs shairport-sync built --with-metadata.
	enabled = "yes";
	include_cover_art = "no";
	pipe_name = "/tmp/shairport-sync-metadata";
};

sessioncontrol =
{
	// Power on the soundbar and select the DVD (HDMI) input
	run_this_before_entering_active_state = "/usr/local/bin/mediackb-airplay on";
	// Restore the previous source or power the soundbar off
	run_this_after_exiting_active_state = "/usr/local/bin/mediackb-airplay off";
	// Hold the audio until the soundbar is ready
	wait_for_completion = "yes";
	// Seconds of silence (e.g. a paused movie) before the session counts as ended
	active_state_timeout = 300.0;
};
